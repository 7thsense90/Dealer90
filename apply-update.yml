# Dealer90 update pipeline
#
# 1. Upload a file named dealer90-update-*.zip to the repo root (GitHub: Add file -> Upload files).
# 2. This workflow unpacks it, installs, runs the API tests and a production build.
# 3. Only if everything passes, it commits the unpacked code to main (Vercel then deploys it)
#    and removes the zip. If anything fails, nothing changes and the run shows the error.
#
# Inside the zip: the files to add/replace (paths from the repo root) and, optionally,
# DELETE.txt listing repo paths to remove (one per line).

name: Apply Dealer90 update

on:
  push:
    branches: [main]
    paths: ['dealer90-update*.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealer90
          POSTGRES_PASSWORD: dealer90
          POSTGRES_DB: d90_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dealer90"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unpack the update
        id: unpack
        run: |
          shopt -s nullglob
          zips=(dealer90-update*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "No dealer90-update*.zip in the repo root - nothing to apply."; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          zip="$(ls -t dealer90-update*.zip | head -1)"
          echo "Applying $zip"
          rm -rf /tmp/update && mkdir -p /tmp/update && unzip -q "$zip" -d /tmp/update
          src=/tmp/update
          # accept a zip whose contents sit inside one top-level folder
          entries=("$src"/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ] && [ ! -f "$src/package.json" ]; then src="${entries[0]}"; fi
          if [ -f "$src/DELETE.txt" ]; then
            while IFS= read -r p || [ -n "$p" ]; do
              p="${p%$'\r'}"; [ -z "$p" ] && continue
              case "$p" in .github/*|/*|*..*) echo "skipping unsafe path: $p"; continue;; esac
              git rm -rf --ignore-unmatch --quiet -- "$p" || true
              rm -rf -- "$p"
            done < "$src/DELETE.txt"
          fi
          # workflow files can't be changed by this pipeline (GitHub doesn't allow it) - skip them
          (cd "$src" && tar --exclude=./DELETE.txt --exclude=./.github --exclude=./.git -cf - .) | tar -xf -
          git rm -f --quiet -- dealer90-update*.zip
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.unpack.outputs.found == 'true'
        run: npm ci

      - name: API tests
        if: steps.unpack.outputs.found == 'true'
        env:
          TEST_DATABASE_URL: postgresql://dealer90:dealer90@localhost:5432/d90_test
        run: npm test

      - name: Production build
        if: steps.unpack.outputs.found == 'true'
        run: npm run build -w apps/web

      - name: Commit to main
        if: steps.unpack.outputs.found == 'true'
        run: |
          git config user.name "dealer90-update-bot"
          git config user.email "dealer90-update-bot@users.noreply.github.com"
          git add -A
          git commit -m "Apply ${{ steps.unpack.outputs.zip }} (tests + build passed)"
          git push

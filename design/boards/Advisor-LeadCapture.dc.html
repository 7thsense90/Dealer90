<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dealer90.com — Where Should We Send Your Offers?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --navy:#10213A; --navy-2:#16294A; --ink:#1C2430; --ink-soft:#5B6472;
  --paper:#F6F4EF; --paper-2:#FFFFFF; --gold:#B98B33; --gold-light:#E7C77E;
  --green:#2F6F4E; --green-bg:#E7F1EA; --line:#E4DFD3;
}
body{margin:0;background:var(--paper);font-family:'Work Sans',sans-serif;color:var(--ink)}
h1,h2,h3{font-family:'Fraunces',serif;margin:0}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}
.field{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:13px 14px;font-size:15px;font-family:'Work Sans',sans-serif;color:var(--ink);background:#fff;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer}
.btn-gold{background:var(--gold);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;}
</style>
</helmet>
<div style="width:1440px;height:1080px;box-sizing:border-box;background:var(--paper);display:flex;flex-direction:column;">

  <!-- NAV -->
  <div style="height:84px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 56px;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:65px;height:38px;border-radius:9px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;color:var(--navy);font-size:15px;letter-spacing:-.02em;">D90</div>
      <div style="color:#fff;font-family:'Work Sans',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;">Dealer90.com</div>
    </div>
    <div style="color:#B9C3D6;font-size:13px;">Property Advisor · Almost done</div>
  </div>

  <!-- DIMMED WIZARD BACKDROP -->
  <div style="position:relative;flex:1;">
    <div style="position:absolute;inset:0;background:rgba(16,33,58,.06);"></div>

    <div style="position:relative;max-width:520px;margin:64px auto 0;padding:0 24px;">

      <!-- STEPPER -->
      <div style="display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:32px;">
        <div style="width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">✓</div>
        <div style="width:44px;height:2px;background:var(--green);"></div>
        <div style="width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">✓</div>
        <div style="width:44px;height:2px;background:var(--gold);"></div>
        <div style="width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">3</div>
      </div>

      <div class="card" style="padding:36px;display:flex;flex-direction:column;gap:22px;box-shadow:0 20px 50px rgba(16,33,58,.14);">
        <div style="text-align:center;">
          <h1 style="font-size:24px;color:var(--navy);">Where should we send your offers?</h1>
          <div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">Dealers respond directly to you. We just need a way to reach you.</div>
        </div>

        <div>
          <label>Full Name</label>
          <input class="field" placeholder="Usman Tariq">
        </div>

        <div>
          <label>Phone Number</label>
          <input class="field" placeholder="03XX XXXXXXX" style="border-color:var(--navy);">
          <div style="font-size:11.5px;color:var(--ink-soft);margin-top:6px;">This creates your Dealer90.com account — you'll use it to log in and track offers. No password needed right now.</div>
        </div>

        <div>
          <label>Email <span style="font-weight:400;color:var(--ink-soft);">(optional)</span></label>
          <input class="field" placeholder="you@email.com">
        </div>

        <label style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;cursor:pointer;">
          <span style="width:18px;height:18px;border-radius:5px;background:var(--navy);flex-shrink:0;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;">✓</span>
          Send me offer updates by WhatsApp, SMS and email. I'm not agreeing to receive calls from dealers directly.
        </label>

        <button class="btn btn-gold" style="width:100%;padding:15px;">Send My Request →</button>
        <a href="#" style="text-align:center;font-size:13px;color:var(--ink-soft);">← Back</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals(){ return {}; }
}
</script>
</body>
</html>

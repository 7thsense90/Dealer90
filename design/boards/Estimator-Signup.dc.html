<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build Cost Estimator — Step 3: Sign Up to See Your Estimate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --navy:#10213A; --navy-2:#1A3155; --gold:#B98B33; --gold-light:#EFE1C2; --ivory:#F6F4EF; --white:#FFFFFF;
  --line:#E4E0D6; --ink:#20242C; --muted:#6B7178; --green:#3F6B4F; --green-bg:#E6EEE7;
}
body{margin:0;background:var(--ivory);font-family:'Work Sans',sans-serif;color:var(--ink)}
h1,h2,h3{font-family:'Fraunces',serif;margin:0}
a{color:inherit;text-decoration:none}
.tag{display:inline-flex;padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700;}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid transparent;cursor:pointer}
.btn-gold{background:var(--gold);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;font-weight:700;color:var(--ink);}
.field input{border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;font-family:'Work Sans',sans-serif;background:#fff;}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.step-dot.active{background:var(--gold);width:22px;border-radius:4px;}
</style>
</helmet>
<div style="width:1440px;height:1040px;box-sizing:border-box;background:rgba(16,33,58,.5);display:flex;align-items:center;justify-content:center;">

  <div class="card" style="width:560px;padding:0;overflow:hidden;">

    <div style="padding:28px 36px 0;">
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <div class="step-dot" style="background:var(--gold);"></div>
        <div class="step-dot" style="background:var(--gold);"></div>
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div style="width:54px;height:32px;border-radius:9px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:#10213A;font-size:13px;letter-spacing:-.02em;">D90</div>
        <div style="color:var(--navy);font-family:'Work Sans',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.01em;">Dealer90.com</div>
      </div>
      <h1 style="font-size:24px;">Your estimate is ready. Sign up to see it.</h1>
      <div style="font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.55;">Creating your free account saves this estimate to your Dealer90.com profile so you can revisit it, adjust it later, and request real quotes from verified providers whenever you're ready.</div>
    </div>

    <div style="padding:26px 36px 0;display:flex;flex-direction:column;gap:16px;">
      <div class="field"><label>Full Name</label><input placeholder="Your name"></div>
      <div class="field"><label>Phone Number</label><input placeholder="03XX-XXXXXXX"></div>
      <div class="field"><label>Email (optional)</label><input placeholder="you@example.com"></div>
      <label style="display:flex;align-items:flex-start;gap:10px;font-size:12.5px;color:var(--muted);line-height:1.5;cursor:pointer;">
        <span style="width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);flex-shrink:0;margin-top:1px;"></span>
        I agree to be contacted by Dealer90.com about this estimate. I'm not agreeing to receive calls from service providers directly.
      </label>
    </div>

    <div style="padding:26px 36px 30px;">
      <button class="btn btn-gold" style="width:100%;">Show My Estimate →</button>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:12px;">Already have an account? <a href="#" style="color:var(--gold);font-weight:700;">Log in</a></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals(){ return {}; }
}
</script>
</body>
</html>

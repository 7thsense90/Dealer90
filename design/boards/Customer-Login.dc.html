<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dealer90.com — Customer Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
:root{
  --navy:#10213A; --navy-2:#16294A; --ink:#1C2430; --ink-soft:#5B6472;
  --paper:#F6F4EF; --paper-2:#FFFFFF; --gold:#B98B33; --gold-light:#E7C77E;
  --amber:#B9772E; --amber-bg:#F6EADA; --line:#E4DFD3;
}
body{margin:0;background:var(--paper);font-family:'Work Sans',sans-serif;color:var(--ink)}
h1,h2,h3{font-family:'Fraunces',serif;margin:0}
label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;}
.field{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:13px 14px;font-size:15px;font-family:'Work Sans',sans-serif;color:var(--ink);background:#fff;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;cursor:pointer}
.btn-gold{background:var(--gold);color:#fff}
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;}
</style>
</helmet>
<div style="width:1200px;height:900px;box-sizing:border-box;background:var(--paper);display:flex;flex-direction:column;">

  <div style="height:84px;background:var(--navy);display:flex;align-items:center;padding:0 56px;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:65px;height:38px;border-radius:9px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;color:var(--navy);font-size:15px;letter-spacing:-.02em;">D90</div>
      <div style="color:#fff;font-family:'Work Sans',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;">Dealer90.com</div>
    </div>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;">
    <div class="card" style="width:440px;padding:40px;display:flex;flex-direction:column;gap:22px;box-shadow:0 20px 50px rgba(16,33,58,.10);">
      <div style="text-align:center;">
        <h1 style="font-size:24px;color:var(--navy);">Welcome back</h1>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:6px;">Log in to track your requests, offers and installments.</div>
      </div>

      <div>
        <label>Phone Number or Email</label>
        <input class="field" placeholder="03XX XXXXXXX or you@email.com">
      </div>

      <div>
        <label>Password</label>
        <input class="field" type="password" placeholder="••••••••">
      </div>

      <button class="btn btn-gold" style="width:100%;padding:15px;">Log In</button>

      <div class="card" style="background:var(--amber-bg);border:none;padding:12px 14px;font-size:12px;color:#6B4E1E;line-height:1.5;">
        First time logging in after submitting a request? We'll recognize your phone number and ask you to set a password — no separate sign-up needed.
      </div>

      <div style="display:flex;justify-content:space-between;font-size:12.5px;">
        <a href="#" style="color:var(--ink-soft);">Forgot password?</a>
        <a href="#" style="color:var(--gold);font-weight:600;">New here? Try the Property Advisor →</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":900}}'>
class Component extends DCLogic {
  renderVals(){ return {}; }
}
</script>
</body>
</html>
